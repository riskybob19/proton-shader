schema = 1
id = "photon_prototype"
name = "Proton"
version = "1.2.8"
api = "0.2"
description = "Proton — a high-performance native Horizon shader with temporal hybrid GI, 3D colored LPV, Decima-inspired distant shadows, volumetric clouds & god rays, neural foliage/water optics, and RDR2 filmic grading."
authors = ["Based on Photon by SixthSurge"]
shared = ["common.wgsl"]

[frame]
blend = "linear"
fog = "pack"

[sky]
file = "sky.wgsl"
clouds = false
sun = false
moon = false
stars = false
reads = ["sky_lighting", "cloud_environment_map", "cloud_aux"]
files = ["atmosphere_read.wgsl", "clouds.wgsl", "environment.wgsl", "celestial.wgsl", "rainbow.wgsl", "air_fog_common.wgsl", "shadow_projection.wgsl"]

[material]
file = "material.wgsl"
reads = ["sky_lighting", "cloud_environment_map", "cloud_aux", "taa_history_previous", "colored_light_volume_previous", "terrain_heightfield_previous"]
files = ["atmosphere_read.wgsl", "skylight_mapping.wgsl", "lpv_common.wgsl", "heightfield_common.wgsl", "clouds.wgsl", "shadow_transmission.wgsl", "world_lighting.wgsl", "conductors.wgsl", "surface_data.wgsl", "wet_surfaces.wgsl", "environment.wgsl", "environment_read.wgsl", "cloud_shadow_read.wgsl", "reflection_options.wgsl", "reflection_history_read.wgsl", "water_options.wgsl", "water.wgsl", "translucent.wgsl", "celestial.wgsl", "shadow_projection.wgsl", "pack_shadow_read.wgsl"]

[entity]
file = "entity.wgsl"
reads = ["sky_lighting", "cloud_aux", "colored_light_volume_previous"]
files = ["atmosphere_read.wgsl", "skylight_mapping.wgsl", "lpv_common.wgsl", "clouds.wgsl", "shadow_transmission.wgsl", "world_lighting.wgsl", "environment.wgsl", "cloud_shadow_read.wgsl", "shadow_projection.wgsl", "pack_shadow_read.wgsl"]

[vertex]
file = "water_vertex.wgsl"
files = ["water_options.wgsl"]

[weather]
file = "weather.wgsl"

[shadow]
resolution = 2048
distance = 144.0
option = "classic_shadow_map"

[reflection]
option = "native_water_mirror"

[ray_tracing]

[[textures]]
id = "aces_output"
