[[resource]]
name = "sky_lighting"
format = "rgba16float"
size = [130, 65]
keep = "view"

[[resource]]
name = "cloud_environment_map"
format = "rgba16float"
size = [1536, 384]
keep = "view"

[[resource]]
name = "cloud_aux"
format = "rgba16float"
size = [1536, 480]
keep = "view"

[[resource]]
name = "reflection_history"
format = "rgba16float"
scale = 0.5
keep = "view"

[[resource]]
name = "taa_history"
format = "rgba16float"
scale = 1.0
keep = "view"

[[resource]]
name = "terrain_heightfield"
format = "rgba16float"
size = [512, 512]
keep = "view"

[[resource]]
name = "gi_history"
format = "rgba16float"
scale = 0.5
keep = "view"

[[resource]]
name = "colored_light_volume"
format = "rgba16float"
size = [512, 256]
keep = "view"

[[before_world]]
file = "atmosphere_compute.wgsl"
dispatch = [130, 65, 1]
workgroup = [8, 8, 1]
reads = ["sky_lighting_previous", "taa_history_previous"]
writes = ["sky_lighting"]

[[before_world]]
file = "environment_compute.wgsl"
files = ["atmosphere_read.wgsl", "clouds.wgsl", "cloud_volume.wgsl", "environment.wgsl", "celestial.wgsl", "shadow_projection.wgsl"]
dispatch = [1536, 480, 1]
workgroup = [8, 8, 1]
reads = ["sky_lighting", "cloud_aux_previous", "cloud_environment_map_previous"]
writes = ["cloud_environment_map", "cloud_aux"]

[[before_world]]
file = "skylight_compute.wgsl"
files = ["atmosphere_read.wgsl", "skylight_mapping.wgsl", "environment.wgsl", "environment_read.wgsl"]
dispatch = [64, 1, 1]
workgroup = [64, 1, 1]
reads = ["sky_lighting", "cloud_environment_map"]
writes = ["cloud_aux"]

[[post]]
file = "heightfield_compute.wgsl"
name = "Decima scrolled world-space terrain heightfield cache"
compute = true
dispatch = [512, 512, 1]
workgroup = [8, 8, 1]
reads = ["terrain_heightfield_previous", "cloud_aux"]
writes = ["terrain_heightfield"]
files = ["environment.wgsl", "heightfield_common.wgsl", "shadow_projection.wgsl", "pack_shadow_read.wgsl"]

[[post]]
file = "depth_hiz_4.wgsl"
name = "Hi-Z 2-tier depth pyramid (4x4 and 12x12 max/avg)"
scale = 0.25
output = "depth_hiz_4"
files = ["environment.wgsl", "surface_data.wgsl", "shadow_projection.wgsl"]

[[post]]
file = "contact_ao.wgsl"
name = "Half-resolution GTAO and screen-space shadows"
scale = 0.5
output = "contact_visibility"
reads = ["cloud_aux", "terrain_heightfield"]
files = ["surface_data.wgsl", "environment.wgsl", "skylight_mapping.wgsl", "heightfield_common.wgsl", "shadow_projection.wgsl", "pack_shadow_read.wgsl"]

[[post]]
file = "ssilvb_gi.wgsl"
name = "Half-resolution 3-layer hybrid voxel GI (SSILVB + Sky + RSM)"
scale = 0.5
output = "indirect_gi_raw"
reads = ["taa_history_previous", "sky_lighting", "cloud_aux"]
files = ["surface_data.wgsl", "atmosphere_read.wgsl", "skylight_mapping.wgsl", "environment.wgsl", "shadow_projection.wgsl", "pack_shadow_read.wgsl"]

[[post]]
file = "gi_denoise_1.wgsl"
name = "Half-resolution voxel-strict A-Trous GI denoise pass 1"
scale = 0.5
output = "indirect_gi_a"
files = ["surface_data.wgsl", "gi_denoise_common.wgsl"]

[[post]]
file = "gi_denoise_2.wgsl"
name = "Half-resolution voxel-strict A-Trous GI denoise pass 2"
scale = 0.5
output = "indirect_gi"
files = ["surface_data.wgsl", "gi_denoise_common.wgsl"]

[[post]]
file = "gi_temporal_compute.wgsl"
name = "Half-resolution temporal GI and distant shadow accumulation"
compute = true
dispatch = "pixels"
workgroup = [8, 8, 1]
reads = ["gi_history_previous"]
writes = ["gi_history"]

[[post]]
file = "lpv_compute.wgsl"
name = "3D scrolled colored light propagation volume (64x32x64)"
compute = true
dispatch = [512, 256, 1]
workgroup = [8, 8, 1]
reads = ["colored_light_volume_previous", "taa_history_previous"]
writes = ["colored_light_volume"]
files = ["surface_data.wgsl", "lpv_common.wgsl"]

[[post]]
file = "fog_compute.wgsl"
name = "Half-resolution reflection TAA"
compute = true
dispatch = "pixels"
workgroup = [8, 8, 1]
reads = ["sky_lighting", "cloud_aux", "cloud_environment_map", "reflection_history_previous", "taa_history_previous", "terrain_heightfield_previous"]
writes = ["reflection_history"]
files = ["atmosphere_read.wgsl", "heightfield_common.wgsl", "shadow_transmission.wgsl", "clouds.wgsl", "cloud_volume.wgsl", "air_fog_common.wgsl", "air_fog.wgsl", "underwater_fog.wgsl", "environment.wgsl", "environment_read.wgsl", "cloud_shadow_read.wgsl", "rainbow.wgsl", "surface_data.wgsl", "reflection_options.wgsl", "reflection_history_read.wgsl", "rt_reflection_common.wgsl", "reflection_history_write.wgsl", "shadow_projection.wgsl", "pack_shadow_read.wgsl"]

[[post]]
file = "fog_scattering.wgsl"
name = "Half-resolution volumetric fog and terrain clouds"
scale = 0.5
output = "fog_scattering"
reads = ["sky_lighting", "cloud_aux", "cloud_environment_map", "colored_light_volume_previous"]
files = ["atmosphere_read.wgsl", "lpv_common.wgsl", "shadow_transmission.wgsl", "clouds.wgsl", "cloud_volume.wgsl", "air_fog_common.wgsl", "air_fog.wgsl", "underwater_fog.wgsl", "environment.wgsl", "environment_read.wgsl", "cloud_shadow_read.wgsl", "rainbow.wgsl", "shadow_projection.wgsl", "pack_shadow_read.wgsl"]

[[post]]
file = "fog_transmittance.wgsl"
name = "Half-resolution analytic fog transmittance"
scale = 0.5
output = "fog_transmittance"
reads = ["sky_lighting", "cloud_aux"]
files = ["atmosphere_read.wgsl", "shadow_transmission.wgsl", "clouds.wgsl", "cloud_volume.wgsl", "air_fog_common.wgsl", "air_fog.wgsl", "underwater_fog.wgsl", "environment.wgsl", "cloud_shadow_read.wgsl", "rainbow.wgsl", "shadow_projection.wgsl", "pack_shadow_read.wgsl"]

[[post]]
file = "composite.wgsl"
name = "Terrain effects and depth-aware volume resolve"
output = "taa_current"
reads = ["sky_lighting", "cloud_aux", "cloud_environment_map", "reflection_history", "gi_history"]
files = ["atmosphere_read.wgsl", "shadow_transmission.wgsl", "clouds.wgsl", "cloud_volume.wgsl", "air_fog_common.wgsl", "air_fog.wgsl", "underwater_fog.wgsl", "environment.wgsl", "cloud_shadow_read.wgsl", "rainbow.wgsl", "celestial.wgsl", "surface_data.wgsl", "skylight_mapping.wgsl", "environment_read.wgsl", "reflection_options.wgsl", "terrain_effects.wgsl", "shadow_projection.wgsl", "pack_shadow_read.wgsl"]

[[post]]
file = "bloom.wgsl"
name = "Bloom highlights"
output = "bloom_near"
scale = 0.25

[[post]]
file = "bloom_wide.wgsl"
name = "Wide bloom"
output = "bloom_wide"
scale = 0.25

[[post]]
file = "bloom_far.wgsl"
name = "Far atmospheric bloom halo"
output = "bloom_far"
scale = 0.25

[[post]]
file = "taa_compute.wgsl"
name = "Temporal and spatial anti-aliasing"
compute = true
dispatch = "pixels"
workgroup = [8, 8, 1]
reads = ["taa_history_previous"]
writes = ["taa_history"]
files = ["antialias.wgsl"]

[[post]]
file = "bloom_combine.wgsl"
name = "Temporal resolve, CAS sharpening, auto-exposure, and bloomy fog composite"
reads = ["taa_history", "sky_lighting"]

[tonemap]
file = "tonemap.wgsl"

